{% extends "layout.html" %}

{% block title %}Edit Expense | ByteBank{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    ✏️ Edit Expense
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Expense Category
                        </label>

                        <input
                            type="text"
                            name="category"
                            class="form-control"
                            value="{{ expense.category }}"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Amount
                        </label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            value="{{ expense.amount }}"
                            step="0.01"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            name="date"
                            class="form-control"
                            value="{{ expense.date }}"
                            required
                        >

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Update Expense
                        </button>

                        <a
                            href="{{ url_for('transactions') }}"
                            class="btn btn-secondary w-100">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
