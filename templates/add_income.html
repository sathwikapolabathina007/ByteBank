{% extends "layout.html" %}

{% block title %}Add Income{% endblock %}

{% block content %}

<div class="container py-5">

    <h2>Add Income</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Income Source</label>
            <input
                type="text"
                name="source"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Amount</label>
            <input
                type="number"
                name="amount"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Date</label>
            <input
                type="date"
                name="date"
                class="form-control"
                required>
        </div>

        <button class="btn btn-success">
            Save Income
        </button>

    </form>

</div>

{% endblock %}
